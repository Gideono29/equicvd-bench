[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "equicvd"
version = "1.0.0rc1"
description = "EquiCVD Bench: calibration and subgroup fairness of U.S. cardiovascular risk tools on NHANES 1999-2018 with linked mortality"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Gideon Owusu", email = "gideono@mtu.edu" }]
maintainers = [{ name = "Gideon Owusu", email = "gideono@mtu.edu" }]
dependencies = ["numpy>=1.24", "pandas>=2.0", "scikit-learn>=1.3", "requests>=2.28", "matplotlib>=3.7"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
equicvd = "equicvd.cli:main"

[tool.setuptools]
packages = ["equicvd"]

[tool.setuptools.package-data]
equicvd = ["data/*.csv"]
